# Workflow یک‌باره برای بازسازی Snapshot نهایی MainActivity از قطعات Base64.
# علت استفاده: GitHub API برای فایل بزرگ UI محدودیت payload دارد؛ این Workflow خروجی دقیق محلی را بازسازی می‌کند.
name: Apply v3 MainActivity snapshot

on:
  push:
    paths:
      - "tools/upgrade_v3/mainactivity/**"
      - ".github/workflows/apply-v3-main.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rebuild final MainActivity
        shell: bash
        run: |
          cat tools/upgrade_v3/mainactivity/part*.b64 | tr -d '\n' | base64 -d > app/src/main/java/com/mdfchi/app/MainActivity.kt

      - name: Verify reconstructed snapshot
        shell: bash
        run: |
          test -s app/src/main/java/com/mdfchi/app/MainActivity.kt
          grep -q 'Screen.OPTIMIZER' app/src/main/java/com/mdfchi/app/MainActivity.kt
          grep -q 'REQUEST_BACKUP_CREATE' app/src/main/java/com/mdfchi/app/MainActivity.kt
          grep -q 'AS.Developers.Support@Gmail.Com' app/src/main/java/com/mdfchi/app/MainActivity.kt
          grep -q 'normalizeNumber' app/src/main/java/com/mdfchi/app/MainActivity.kt

      - name: Commit final UI snapshot
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/mdfchi/app/MainActivity.kt
          if git diff --cached --quiet; then
            echo "MainActivity already matches final snapshot."
          else
            git commit -m "feat: finish Smart Cabinet Assistant v3 UI"
            git push
          fi
