# Workflow ساخت Release خام Android برای نسخه 2.
name: Build Android Release APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android 35 SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"
      - name: Build unsigned release APK
        run: gradle :app:assembleRelease --stacktrace
      - name: Upload unsigned release APK
        uses: actions/upload-artifact@v4
        with:
          name: CabinetSmartAssistant-v2.0.0-release-unsigned
          path: app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
      - name: Collect APK signer
        run: cp "$ANDROID_HOME/build-tools/35.0.0/lib/apksigner.jar" ./apksigner.jar
      - name: Upload APK signer
        uses: actions/upload-artifact@v4
        with:
          name: android-apksigner-35
          path: apksigner.jar
          if-no-files-found: error
