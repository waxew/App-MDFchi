# نام Workflow در تب Actions گیت‌هاب.
name: Build Android Release APK

# Build با Push/PR روی main یا اجرای دستی انجام می‌شود.
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

# Workflow فقط سورس را می‌خواند و کلید خصوصی در GitHub ذخیره نمی‌شود.
permissions:
  contents: read

jobs:
  build:
    # Runner لینوکس برای Build اندروید.
    runs-on: ubuntu-latest
    steps:
      # دریافت سورس Commit جاری.
      - name: Checkout source
        uses: actions/checkout@v4

      # Java 17 موردنیاز Android Gradle Plugin فعلی.
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # آماده‌سازی Android SDK.
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # نصب Platform و Build Tools دقیق پروژه.
      - name: Install Android 35 SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      # Gradle سازگار با AGP 8.8.2.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      # ساخت APK Release خام؛ امضای خصوصی خارج از Repository انجام می‌شود.
      - name: Build unsigned release APK
        run: gradle :app:assembleRelease --stacktrace

      # نگهداری APK خام به‌عنوان Artifact CI.
      - name: Upload unsigned release APK
        uses: actions/upload-artifact@v4
        with:
          name: MDFchi-v1.0.2-release-unsigned
          path: app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error

      # کپی ابزار رسمی apksigner برای امضای v1/v2/v3 خروجی نهایی.
      - name: Collect APK signer
        run: cp "$ANDROID_HOME/build-tools/35.0.0/lib/apksigner.jar" ./apksigner.jar

      # تحویل apksigner به‌صورت Artifact.
      - name: Upload APK signer
        uses: actions/upload-artifact@v4
        with:
          name: android-apksigner-35
          path: apksigner.jar
          if-no-files-found: error
